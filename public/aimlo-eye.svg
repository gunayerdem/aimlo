<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none">
  <defs>
    <linearGradient id="eyeG" x1="0" y1="80" x2="200" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="45%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#FF4690"/>
    </linearGradient>
  </defs>
  <!-- Outer eye - top curve -->
  <path d="M20 80 C20 30, 60 8, 100 8 C140 8, 180 30, 180 80" stroke="url(#eyeG)" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- Outer eye - bottom curve -->
  <path d="M20 80 C20 130, 60 152, 100 152 C140 152, 180 130, 180 80" stroke="url(#eyeG)" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- Inner diamond/iris - rotated square with rounded corners -->
  <rect x="62" y="42" width="76" height="76" rx="12" transform="rotate(45 100 80)" stroke="url(#eyeG)" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Pupil - inner curved line -->
  <path d="M72 80 C72 58, 86 46, 100 46" stroke="url(#eyeG)" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.7"/>
</svg>
